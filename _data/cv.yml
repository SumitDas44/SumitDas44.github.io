        publisher: PLOS ONE
        releaseDate: 2026-08-27
        url: https://doi.org/10.1371/journal.pone.0346479
        summary: This work focuses on improving the stability, network lifetime, throughput, and energy efficiency of heterogeneous Wireless Sensor Networks (WSNs). We developed EZS-SEP by combining zonal stable election routing, Self-Organizing Maps (SOM), and an energy-distance-aware communication strategy for efficient node deployment and data transmission.

