        highlights:
          - Wireless Sensor Network: During my undergraduate thesis, I enhanced the network lifetime and energy efficiency of SEP and DEEC protocol by introducing improved probability, threshold equations and implementing advanced deployment and sleep-awake schedules of the nodes. The enhanced protocol nearly got 34% stability period improvement compared to the parent protocol.
          - Machine Learning integration with WSN: Used Self-organizing maps for the deployment of nodes, which got around 7% better area coverage, and used clustering algorithms to organize the clusters in SEP protocol. Also used the random forest algorithm in deciding a secondary cluster-head for multi-hop routing.

