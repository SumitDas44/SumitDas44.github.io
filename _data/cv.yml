    Projects:        
      - name: Gesture based AI Keyboard and Volume Control
        summary: Developed a contactless human-computer interface using Python, OpenCV, and MediaPipe. Integrated a virtual keyboard that simulates keystrokes via thumb-index pinch gestures (using pynput) and a dynamic volume controller that maps finger proximity to Windows Audio API commands for real-time system interaction.

        highlights:
        
        start_date: 2025
        end_date: 2025

      - name: YOLO Object Detection & Tracking
        summary: Developed a suite of real-time vision applications using YOLOv8 and SORTfor multi-object tracking. Implemented bi-directional traffic and pedestrian counters, and trained custom models for safety gear detection and real-time Poker Hand Analysis.
        highlights:
        
        start_date: 2025
        end_date: 2025

      - name: Ai Football Analysis System
        summary: Built a YOLO-based analysis tool to track football players and calculate speed/distance in meters. Utilized K-Means for team assignment, Optical Flow to handle camera movement, and Perspective Transformation to accurately map the field dimensions.
        highlights:
        
        start_date: 2025
        end_date: 2025

      - name: IoT-Based Patient Monitoring System
        summary: Developed a system using ESP32 and Arduino to track vital signs (BPM, Temp, CO2) and fall detection. Features real-time MATLAB visualization and automated SMS alerts.
        highlights:
        
        start_date: 2024
        end_date: 2025

      - name: Campus Network
        summary: Simulated a secure campus network (ECE, CSE, Admin) using Cisco Packet Tracer. Integrated DHCP, VLANs, Web/DNS servers, and RIP dynamic routing with ACL security.
        highlights:
        
        start_date: 2024
        end_date: 2024

      - name: Target Retrieval Rover
        summary: Built an autonomous line-following rover with a custom robotic claw. Utilized a hybrid architecture (Arduino & Raspberry Pi) with OpenCV for real-time color detection.
        highlights:
        
        start_date: 2023
        end_date: 2024

      - name: FIR Filter Design
        summary: Designed a MATLAB bandpass filter (1500–2750 Hz) using Hanning/Hamming windows to suppress noise.
        highlights:
        
        start_date: 2022
        end_date: 2023

      - name: UWB Vivaldi Antenna Design
        summary: Designed and simulated an Ultra-Wideband (UWB) Vivaldi Antenna using CST Studio Suite (2.5–4 GHz). Achieved resonance at 3.2 GHz with a return loss of −47.06 dB, VSWR≈1,and 10.25 dBi directivity at 4 GHz. Optimized for narrow beamwidth (HPBW < 70◦) to enable precise wireless detection.
        highlights:
        
        start_date: 2022
        end_date: 2023

      - name: Blood Bank Management DBMS
        summary: Created an SQL database to automate blood inventory, expiration tracking, and donor availability dashboards.
        highlights:
        
        start_date: 2022
        end_date: 2023

      - name: TeliGari-BaZaar (E-commerce)
        summary: Developed an automotive e-commerce site using PHP and MySQL with secure authentication and persistent carts.
        highlights:
        
        start_date: 2022
        end_date: 2022

      - name: Variable DC Power Supply
        summary: Designed a 220V AC to 5V–35V regulated DC supply. Implemented short-circuit and over/under-voltage protection (> 30V, < 10V) using LM358 op-amps and transistor logic. Integrated LM317T regulators, relays, and SCRs for stable output. Simulated in Proteus and implemented on Veroboard.
        highlights:
        
        start_date: 2021
        end_date: 2022

